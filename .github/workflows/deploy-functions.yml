name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

# A second deploy would race the Cloud Run write quota, and cancelling one
# halfway leaves the function set inconsistent.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Authenticates firebase-tools through GOOGLE_APPLICATION_CREDENTIALS.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # 109 functions in one run exceeds the Cloud Run "write requests per
      # minute per region" quota, so deploy in batches (ADR 0011). Batch size
      # and the pause between batches are the values proven by
      # redeploy-functions-temp.sh.
      - name: Deploy functions in batches
        run: |
          set -euo pipefail

          mapfile -t CHUNKS < <(node -e '
            const fs = require("fs");
            const src = fs.readFileSync("functions/src/index.ts", "utf8");
            const names = [...src.matchAll(/^\s{2}([A-Za-z0-9_]+),$/gm)].map((m) => m[1]);
            for (let i = 0; i < names.length; i += 11)
              console.log(names.slice(i, i + 11).map((n) => "functions:" + n).join(","));
          ')
          total=${#CHUNKS[@]}
          [ "$total" -gt 0 ] || { echo "No function exports found in functions/src/index.ts"; exit 1; }
          echo "Deploying $total batches"

          for i in "${!CHUNKS[@]}"; do
            echo "::group::batch $((i + 1))/$total"
            npx firebase deploy --only "${CHUNKS[$i]}" --project scango-8f0e9 --non-interactive
            echo "::endgroup::"
            if [ "$((i + 1))" -lt "$total" ]; then sleep 45; fi
          done
